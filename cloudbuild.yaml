
steps:
# Step 1: Detect changed files and determine which microservices need deployment
- name: 'gcr.io/cloud-builders/git'
  id: 'detect-changes'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -e
    # Fetch the remote branch to compare against
    git fetch origin $BRANCH_NAME
    # Get a unique list of changed directories under 'microservices/'
    # Compare HEAD (current commit) with origin/$BRANCH_NAME (previous state of the branch)
    git diff --name-only origin/$BRANCH_NAME HEAD | grep '^microservices/' | cut -d '/' -f 2 | sort -u > changed_services.txt

    if [ ! -s changed_services.txt ]; then
      echo "No changes detected in microservices. Skipping deployment."
      # Create a dummy file to indicate no services need deployment
      touch /workspace/no_services_to_deploy.flag
    else
      echo "Changes detected in the following microservices:"
      cat changed_services.txt
    fi

# Step 2: Deploy only the changed microservices
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'deploy-changed-services'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    #!/bin/bash
    # If no services need deployment, exit gracefully
    if [ -f "/workspace/no_services_to_deploy.flag" ]; then
      echo "No microservices to deploy. Exiting step."
      exit 0
    fi

    # Read the list of changed services
    mapfile -t services_to_deploy < changed_services.txt

    # Define common deployment arguments
    COMMON_RUN_ARGS="--region=asia-northeast1 --project=$_PROJECT_ID"

    # Loop through each changed service and deploy it
    for service_name in "${services_to_deploy[@]}"; do
      echo "-----------------------------------------------------"
      echo "Attempting to deploy: $service_name"
      echo "-----------------------------------------------------"

      # Determine deployment command and service account based on service_name
      DEPLOY_CMD="gcloud run deploy"
      SERVICE_ACCOUNT="328258682114-compute@developer.gserviceaccount.com" # Default compute SA
      ALLOW_UNAUTHENTICATED="--allow-unauthenticated"
      IS_JOB=false
      IS_FUNCTION=false

      case "$service_name" in
        "orion-backtester")
          DEPLOY_CMD="gcloud run jobs deploy"
          IS_JOB=true
          ;;
        "alpha-loop-launcher"|"orion-calendar-importer"|"orion-daily-heartbeat"|
        "orion-estat-fetcher"|"orion-fred-fetcher"|"orion-gov-fetcher"|
        "orion-hr-fetcher"|"orion-job-sentiment-analyzer"|"zero-cost-filter"|
        "trigger-alpha-loop-func")
          DEPLOY_CMD="gcloud functions deploy"
          IS_FUNCTION=true
          # Functions often need specific runtimes and entrypoints
          # This is a simplified example, actual function deployment needs more args
          ;;
        "orion-news-fetcher")
          SERVICE_ACCOUNT="orion-news-fetcher-sa@project-orion-admins.iam.gserviceaccount.com"
          ;;
        # Add more specific service account mappings here if needed
      esac

      # Construct the full deployment command
      FULL_DEPLOY_CMD=""
      if [ "$IS_JOB" = true ]; then
        FULL_DEPLOY_CMD="$DEPLOY_CMD $service_name --source=./microservices/$service_name $COMMON_RUN_ARGS --service-account=$SERVICE_ACCOUNT"
      elif [ "$IS_FUNCTION" = true ]; then
        # This is a placeholder. Actual function deployment requires more specific args.
        # You'll need to fill in runtime, entry-point, trigger-topic/http, etc.
        echo "WARNING: Function deployment for $service_name is a placeholder. Please update cloudbuild.yaml."
        FULL_DEPLOY_CMD="$DEPLOY_CMD $service_name --gen2 --runtime=python310 --source=./microservices/$service_name --entry-point=main $COMMON_RUN_ARGS --service-account=$SERVICE_ACCOUNT"
      else # Regular Cloud Run Service
        FULL_DEPLOY_CMD="$DEPLOY_CMD $service_name --source=./microservices/$service_name $COMMON_RUN_ARGS $ALLOW_UNAUTHENTICATED --service-account=$SERVICE_ACCOUNT"
      fi

      echo "Running command: $FULL_DEPLOY_CMD"
      # Execute the deployment command
      # Using 'bash -c' to ensure proper command parsing and execution
      bash -c "$FULL_DEPLOY_CMD"

      echo "Deployment of $service_name completed."
    done
