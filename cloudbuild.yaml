steps:
# Step 1: Detect changed services
- name: 'gcr.io/cloud-builders/git'
  id: 'detect-changes'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    git fetch origin master
    CHANGED_DIRS=$(git diff --name-only origin/master HEAD | xargs -n 1 dirname | sort -u)
    if [ -z "$CHANGED_DIRS" ]; then
      echo "No changes detected in service directories."
    else
      echo "Detected changes in the following services:"
      for DIR in $CHANGED_DIRS; do
        SERVICE_NAME=$(basename "$DIR")
        echo "- $SERVICE_NAME"
        touch "/workspace/$SERVICE_NAME.build_flag"
      done
    fi

# --- Dynamic Deployment Steps for each service ---
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'deploy-all-services'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    # Define all services and their deployment commands
    declare -A SERVICES
    SERVICES["orion-sec-fetcher"]="gcloud run deploy orion-sec-fetcher \
      --source=./microservices/orion-sec-fetcher --region=asia-northeast1 \
      --service-account=orion-service-account@$PROJECT_ID.iam.gserviceaccount.com \
      --no-allow-unauthenticated --set-env-vars=GCP_PROJECT=$PROJECT_ID"
    # ... Add all other 16 services here in the same format ...
    for SERVICE_NAME in "${!SERVICES[@]}"; do
      if [ -f "/workspace/$SERVICE_NAME.build_flag" ]; then
        echo "--- Deploying $SERVICE_NAME ---"
        COMMAND=${SERVICES[$SERVICE_NAME]}
        $COMMAND &
      fi
    done
    wait
options:
  logging: CLOUD_LOGGING_ONLY
